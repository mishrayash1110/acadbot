<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>AcadBot — Academic Support</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0a0f1e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="AcadBot"/>
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png"/>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    #install-banner{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2563eb,#06b6d4);color:white;padding:13px 22px;border-radius:100px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;z-index:999;box-shadow:0 4px 24px rgba(37,99,235,0.5);cursor:pointer;align-items:center;gap:8px;white-space:nowrap;font-weight:600}
    #install-banner.show{display:flex}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="install-banner" onclick="installPWA()">📲 Install AcadBot as App</div>
  <script src="/js/app.js"></script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));}
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-banner').classList.add('show');});
    function installPWA(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').classList.remove('show');});}
  </script>
</body>
</html>
